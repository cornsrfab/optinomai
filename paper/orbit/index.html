<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Orbits</title>
<meta name="description" content="흰 종이모형들이 파란 배경 위에서 위성 궤도를 따라 도는 페이지.">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#143a7a;font-family:'Courier New',monospace}
  canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#9db6dc;pointer-events:none;opacity:.8}
</style>
</head>
<body>
<canvas id="sky" aria-label="위성 궤도를 도는 종이모형. 드래그로 시점을 돌릴 수 있습니다."></canvas>
<div class="hint" aria-hidden="true">DRAG TO ORBIT</div>
<script src="../../paper-models.js"></script>
<script src="../mesh.js"></script>
<script>
(() => {
  const canvas = document.getElementById('sky'), ctx = canvas.getContext('2d'), reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tone = sh => `rgb(${Math.round(196+59*sh)},${Math.round(202+53*sh)},${Math.round(214+41*sh)})`;
  // Each model is pre-rendered at 36 tumbling angles; the satellites are drawn as sprites so dozens can move at once.
  const FRAMES = 36, SPR = 160, sprites = PaperMesh.meshes.map((_, m) => Array.from({length: FRAMES}, (_, f) => {
    const c = document.createElement('canvas'); c.width = c.height = SPR; const g = c.getContext('2d');
    PaperMesh.render(g, m, f/FRAMES*Math.PI*2 + m, -.35 + .5*Math.sin(f/FRAMES*Math.PI*2), SPR, tone); return c;
  }));
  // Orbits: radius (fraction of the planet-centred scene), inclination, ascending node, period in seconds, number of satellites.
  const orbits = [
    {r:1.55, inc:.12, node:0,    period:46,  n:3},
    {r:1.95, inc:.55, node:1.1,  period:62,  n:4},
    {r:2.35, inc:1.05, node:2.3, period:78,  n:3},
    {r:2.75, inc:.35, node:3.9,  period:96,  n:4},
    {r:3.15, inc:1.35, node:.6,  period:118, n:3},
    {r:3.55, inc:.8,  node:5.1,  period:140, n:3},
  ];
  const sats = []; orbits.forEach((o, oi) => { for (let k = 0; k < o.n; k++) sats.push({o, phase: k/o.n*Math.PI*2 + oi*.7, model: (oi + k*2) % 5, spin: .6 + ((oi*3+k)%5)*.25}); });
  let W, H, R, yaw = .4, pitch = .62, drag = null, vel = 0;
  function size() { const d = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; canvas.width = W*d; canvas.height = H*d; ctx.setTransform(d,0,0,d,0,0); R = Math.min(W, H) * .12; }
  // Orbital plane → world → view (yaw about the vertical axis, then pitch) → perspective.
  function place(o, ang) {
    const x0 = Math.cos(ang)*o.r, y0 = Math.sin(ang)*o.r;
    const x1 = x0*Math.cos(o.node) - y0*Math.cos(o.inc)*Math.sin(o.node), z1 = x0*Math.sin(o.node) + y0*Math.cos(o.inc)*Math.cos(o.node), y1 = y0*Math.sin(o.inc);
    const x2 = x1*Math.cos(yaw) + z1*Math.sin(yaw), z2 = -x1*Math.sin(yaw) + z1*Math.cos(yaw);
    const y3 = y1*Math.cos(pitch) - z2*Math.sin(pitch), z3 = y1*Math.sin(pitch) + z2*Math.cos(pitch);
    const f = 9/(9 - z3); return {x: W/2 + x2*R*f, y: H/2 - y3*R*f, z: z3, f};
  }
  const hiddenByPlanet = p => p.z < 0 && Math.hypot(p.x - W/2, p.y - H/2) < R;
  function frame(t) {
    const s = t/1000; if (!drag && !reduced) { yaw += .0018 + vel; vel *= .96; }
    const bg = ctx.createRadialGradient(W*.5, H*.45, 0, W*.5, H*.45, Math.max(W,H)*.75); bg.addColorStop(0, '#1d4b94'); bg.addColorStop(1, '#0d2a5b');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // Orbit paths (segments behind the planet are left out).
    ctx.lineWidth = .8;
    for (const o of orbits) { let prev = null; for (let i = 0; i <= 180; i++) { const p = place(o, i/180*Math.PI*2); if (prev && !hiddenByPlanet(p) && !hiddenByPlanet(prev)) { ctx.strokeStyle = `rgba(190,212,245,${.2 + .25*(p.z+3.6)/7.2})`; ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke(); } prev = p; } }
    // Satellites behind the planet, then the planet, then the ones in front.
    const placed = sats.map(st => ({st, p: place(st.o, st.phase + s/st.o.period*Math.PI*2)})).sort((a, b) => a.p.z - b.p.z);
    const drawSat = ({st, p}) => { if (hiddenByPlanet(p)) return; const size = R*.8*p.f, fr = ((Math.floor(s*st.spin*6) % FRAMES) + FRAMES) % FRAMES; ctx.globalAlpha = .55 + .45*(p.z+3.6)/7.2; ctx.drawImage(sprites[st.model][fr], p.x - size/2, p.y - size/2, size, size); ctx.globalAlpha = 1; };
    placed.filter(a => a.p.z < 0).forEach(drawSat);
    const pg = ctx.createRadialGradient(W/2 - R*.35, H/2 - R*.4, R*.1, W/2, H/2, R); pg.addColorStop(0, '#5f8fd6'); pg.addColorStop(1, '#1a3f80');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(W/2, H/2, R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(200,220,250,.35)'; ctx.lineWidth = .7; for (let k = -2; k <= 2; k++) { const y = H/2 + k*R*.33, w = Math.sqrt(Math.max(0, R*R - (k*R*.33)**2)); ctx.beginPath(); ctx.ellipse(W/2, y, w, w*.18, 0, 0, Math.PI*2); ctx.stroke(); }
    placed.filter(a => a.p.z >= 0).forEach(drawSat);
    if (!reduced) requestAnimationFrame(frame);
  }
  canvas.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY}; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x; yaw += dx*.005; vel = dx*.0004; pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - drag.y)*.005)); drag = {x: e.clientX, y: e.clientY}; if (reduced) frame(performance.now()); });
  canvas.addEventListener('pointerup', () => drag = null); canvas.addEventListener('pointercancel', () => drag = null);
  addEventListener('resize', () => { size(); if (reduced) frame(performance.now()); });
  size(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Field</title>
<meta name="description" content="검은 종이모형만 깔린 페이지. 끌어서 휴지통에 버릴 수 있습니다.">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:'Courier New',monospace;-webkit-tap-highlight-color:transparent}
  #field{position:fixed;inset:0}
  .module{position:absolute;padding:0;border:0;background:none;cursor:grab;touch-action:none;transition:transform .25s}
  .module canvas{display:block;width:100%;height:100%;pointer-events:none}
  .module.dragging{cursor:grabbing;z-index:5;transition:none;filter:drop-shadow(0 10px 10px #0003)}
  .module.gone{transition:transform .45s cubic-bezier(.5,0,.9,.4),opacity .45s;opacity:0}
  #trash{position:fixed;right:28px;bottom:24px;z-index:10;width:56px;height:68px;padding:0;border:0;background:none;cursor:pointer;color:#111}
  #trash svg{width:100%;height:100%;overflow:visible}
  #trash .lid{transform-origin:12px 13px;transition:transform .2s}
  #trash.open .lid,#trash:hover .lid{transform:rotate(-18deg)}
  #trash.gulp{animation:gulp .35s}
  @keyframes gulp{40%{transform:scale(1.12) rotate(-4deg)}}
  #count{position:absolute;right:-6px;top:-4px;font-size:10px;letter-spacing:1px;color:#111}
  #trash:focus-visible{outline:1px solid #111;outline-offset:4px}
  @media (prefers-reduced-motion: reduce){.module,.module.gone{transition:none}#trash.gulp{animation:none}}
</style>
</head>
<body>
<div id="field" role="group" aria-label="검은 종이모형"></div>
<button id="trash" aria-label="휴지통 — 누르면 버린 종이모형을 다시 꺼냅니다" title="휴지통">
  <svg viewBox="0 0 48 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
    <g class="lid"><path d="M6 13h36"/><path d="M18 13V8h12v5"/></g>
    <path d="M10 17l3 37h22l3-37"/><path d="M19 23v25M24 23v25M29 23v25"/>
  </svg>
  <span id="count"></span>
</button>
<script src="../paper-models.js"></script>
<script>
(() => {
  const field = document.getElementById('field'), trash = document.getElementById('trash'), count = document.getElementById('count');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sub=(a,b)=>a.map((x,i)=>x-b[i]), cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], unit=a=>{const n=Math.hypot(...a)||1;return a.map(x=>x/n);};
  const light = unit([-.4,.6,1]), N = 7;
  // Folded hyparhedron meshes (the same models as the portfolio), built once.
  const meshes = window.PaperModels.map(model => {
    const tris = [];
    for (const [A,B,C,D] of model.patches) {
      const pts = [];
      for (let i=0;i<=N;i++){pts[i]=[];for(let j=0;j<=N;j++){const u=i/N,v=j/N;
        const p=A.map((a,k)=>(1-u)*(1-v)*a+u*(1-v)*B[k]+u*v*C[k]+(1-u)*v*D[k]);
        const du=A.map((a,k)=>(1-v)*(B[k]-a)+v*(C[k]-D[k])),dv=A.map((a,k)=>(1-u)*(D[k]-a)+u*(C[k]-B[k]));
        const n=unit(cross(dv,du)),r=Math.max(Math.abs(2*u-1),Math.abs(2*v-1)),q=r*6,k=Math.floor(q),f=q-k,w=(1-f)*(-1)**k+f*(-1)**(k+1);
        pts[i][j]=p.map((x,m)=>x+n[m]*.045*w*Math.min(1,r*6,(1-r)*6));}}
      for(let i=0;i<N;i++)for(let j=0;j<N;j++){const a=pts[i][j],b=pts[i+1][j],c=pts[i+1][j+1],d=pts[i][j+1];tris.push([a,b,c],[a,c,d]);}
    }
    return tris;
  });
  // Black paper: dark faces, with the planes facing the light only slightly lifted.
  function draw(canvas, model, angle, tilt, size) {
    const dpr = Math.min(devicePixelRatio||1, 2); canvas.width = canvas.height = Math.round(size*dpr);
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    const rot = p => { const x=p[0]*Math.cos(angle)+p[2]*Math.sin(angle), z=-p[0]*Math.sin(angle)+p[2]*Math.cos(angle); return [x,p[1]*Math.cos(tilt)-z*Math.sin(tilt),p[1]*Math.sin(tilt)+z*Math.cos(tilt)]; };
    const faces = meshes[model].map(t => t.map(rot)).sort((a,b)=>a[0][2]+a[1][2]+a[2][2]-b[0][2]-b[1][2]-b[2][2]), s = size*.27;
    for (const ps of faces) {
      const sh = Math.abs(unit(cross(sub(ps[1],ps[0]),sub(ps[2],ps[0]))).reduce((a,n,k)=>a+n*light[k],0)), g = Math.round(14+70*sh*sh);
      ctx.fillStyle = `rgb(${g},${g},${g+1})`; ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = .4;
      ctx.beginPath(); ps.forEach((p,i)=>i?ctx.lineTo(size/2+p[0]*s,size/2-p[1]*s):ctx.moveTo(size/2+p[0]*s,size/2-p[1]*s)); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  let modules = [], binned = [];
  function build() {
    field.replaceChildren(); modules = []; binned = []; update();
    const W = innerWidth, H = innerHeight, step = Math.max(78, Math.min(124, W/10)), rowH = step*.87, size = step*.84;
    for (let row = 0; row*rowH < H + step; row++) for (let col = -1; col*step < W + step; col++) {
      const x = col*step + (row%2 ? step/2 : 0), y = row*rowH + step*.3, model = ((col%5)+5 + row*2) % 5;
      const el = document.createElement('button'); el.className = 'module'; el.tabIndex = -1;
      el.setAttribute('aria-label', '종이모형 — 휴지통으로 끌어서 버리기');
      el.style.cssText = `left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px`;
      const cv = document.createElement('canvas'); el.append(cv); field.append(el);
      draw(cv, model, .55 + col*.42 + row*.27, -.35 + (row%3)*.12, size);
      modules.push(el); drag(el);
    }
  }
  function overTrash(x, y) { const r = trash.getBoundingClientRect(); return x > r.left-30 && x < r.right+30 && y > r.top-30 && y < r.bottom+30; }
  function drag(el) {
    let start = null;
    el.addEventListener('pointerdown', e => { start = {x:e.clientX, y:e.clientY}; el.setPointerCapture(e.pointerId); el.classList.add('dragging'); });
    el.addEventListener('pointermove', e => { if (!start) return; el.style.transform = `translate(${e.clientX-start.x}px,${e.clientY-start.y}px) scale(1.08)`; trash.classList.toggle('open', overTrash(e.clientX, e.clientY)); });
    const end = e => { if (!start) return; el.classList.remove('dragging'); trash.classList.remove('open');
      if (overTrash(e.clientX, e.clientY)) throwAway(el, e.clientX-start.x, e.clientY-start.y); else el.style.transform = '';
      start = null; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', () => { start = null; el.classList.remove('dragging'); el.style.transform = ''; });
  }
  function throwAway(el, dx, dy) {
    const r = trash.getBoundingClientRect(), b = el.getBoundingClientRect();
    const tx = dx + (r.left + r.width/2) - (b.left + b.width/2), ty = dy + (r.top + r.height*.55) - (b.top + b.height/2);
    el.classList.add('gone'); el.style.transform = `translate(${tx}px,${ty}px) scale(.1) rotate(160deg)`;
    setTimeout(() => { el.hidden = true; }, reduced ? 0 : 450);
    binned.push(el); update(); if (!reduced) { trash.classList.remove('gulp'); void trash.offsetWidth; trash.classList.add('gulp'); }
  }
  function update() { count.textContent = binned.length ? binned.length : ''; }
  // Clicking the bin puts everything back where it was.
  trash.addEventListener('click', () => { for (const el of binned) { el.hidden = false; el.classList.remove('gone'); el.style.transform = ''; } binned = []; update(); });
  let last = innerWidth; addEventListener('resize', () => { if (Math.abs(innerWidth - last) > 60) { last = innerWidth; build(); } });
  build();
})();
</script>
</body>
</html>
